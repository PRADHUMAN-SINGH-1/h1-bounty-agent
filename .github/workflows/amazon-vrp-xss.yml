name: Amazon VRP Reflected XSS Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/amazon-vrp-xss.yml"

permissions:
  contents: read

jobs:
  xss:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-fund --no-audit playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Test Amazon.in reflected XSS candidates
        shell: bash
        run: |
          set -euo pipefail
          echo "" | base64 -d > xss-test.mjs
          node xss-test.mjs
