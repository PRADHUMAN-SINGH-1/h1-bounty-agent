name: Repair research loop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-loop]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bounded research execution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          research = Path('src/h1_agent/research.py')
          s = research.read_text()
          if 'self._deadline: float | None = None' not in s:
              s = s.replace('        self.last_request = 0.0\n', '        self.last_request = 0.0\n        self._deadline: float | None = None\n', 1)
              s = s.replace('    def close(self) -> None:\n', '''    def _remaining(self) -> float:\n        if self._deadline is None:\n            return 12.0\n        return self._deadline - time.monotonic()\n\n    def _request_timeout(self) -> float:\n        remaining = self._remaining()\n        if remaining <= 0:\n            raise httpx.ReadTimeout("research target deadline exceeded")\n        return max(0.25, min(12.0, remaining))\n\n    def close(self) -> None:\n''', 1)
              s = s.replace('''        if remaining > 0:\n            time.sleep(remaining)\n        self.last_request = time.monotonic()\n\n    def _get(self, url: str, **kwargs) -> httpx.Response:\n        self._wait()\n        return self.client.get(url, **kwargs)\n\n    def _options(self, url: str) -> httpx.Response:\n        self._wait()\n        return self.client.options(url)\n\n    def _head(self, url: str) -> httpx.Response:\n        self._wait()\n        return self.client.head(url, follow_redirects=False)\n''', '''        if self._deadline is not None and self._remaining() <= 0:\n            raise httpx.ReadTimeout("research target deadline exceeded")\n        if remaining > 0:\n            time.sleep(min(remaining, self._remaining()))\n        self.last_request = time.monotonic()\n\n    def _get(self, url: str, **kwargs) -> httpx.Response:\n        self._wait()\n        kwargs.setdefault("timeout", self._request_timeout())\n        return self.client.get(url, **kwargs)\n\n    def _options(self, url: str) -> httpx.Response:\n        self._wait()\n        return self.client.options(url, timeout=self._request_timeout())\n\n    def _head(self, url: str) -> httpx.Response:\n        self._wait()\n        return self.client.head(url, follow_redirects=False, timeout=self._request_timeout())\n''', 1)
              s = s.replace('''    ) -> list[CheckResult]:\n        asset = require_in_scope(target, self.scopes)\n''', '''    ) -> list[CheckResult]:\n        asset = require_in_scope(target, self.scopes)\n        self._deadline = time.monotonic() + max(30, self.settings.research_target_timeout_seconds)\n''', 1)
              research.write_text(s)

          worker = Path('src/h1_agent/worker.py')
          s = worker.read_text()
          old = '''                program_tool_evidence, toolchain_runs = run_deep_toolchain(\n                    roots,\n                    scopes,\n                    max_roots=settings.toolchain_max_roots,\n                    active=active,\n                )'''
          new = '''                if on_progress:\n                    on_progress({\n                        "program": handle,\n                        "target": None,\n                        "phase": "finding_evidence",\n                        "detail": f"Running bounded discovery toolchain across {len(roots)} scoped roots",\n                        "planned_targets": len(selected_assets),\n                        "completed_targets": 0,\n                    })\n                program_tool_evidence, toolchain_runs = run_deep_toolchain(\n                    roots,\n                    scopes,\n                    max_roots=settings.toolchain_max_roots,\n                    max_targets=settings.toolchain_max_targets,\n                    httpx_timeout=settings.toolchain_httpx_timeout_seconds,\n                    katana_timeout=settings.toolchain_katana_timeout_seconds,\n                    nuclei_timeout=settings.toolchain_nuclei_timeout_seconds,\n                    active=active,\n                )'''
          if old in s: s=s.replace(old,new,1)
          old = '''            engine = LowImpactResearch(settings, scopes)\n            try:\n                evidence_results = engine.run(target, active=active, deep=deep)'''
          new = '''            if on_progress:\n                on_progress({\n                    "program": handle,\n                    "target": target,\n                    "phase": "finding_evidence",\n                    "detail": f"Collecting bounded HTTP evidence (max {settings.research_target_timeout_seconds}s)",\n                    "planned_targets": len(selected_assets),\n                    "completed_targets": index - 1,\n                })\n            engine = LowImpactResearch(settings, scopes)\n            try:\n                evidence_results = engine.run(target, active=active, deep=deep)'''
          if old in s: s=s.replace(old,new,1)
          old = '''        try:\n            triage = llm.triage_evidence('''
          new = '''        if on_progress:\n            on_progress({\n                "program": handle,\n                "target": target,\n                "phase": "triaging_evidence",\n                "detail": f"Evaluating {len(evidence_json)} evidence items",\n                "planned_targets": len(selected_assets),\n                "completed_targets": index,\n                "evidence_collected": len(evidence_json),\n            })\n\n        try:\n            triage = llm.triage_evidence('''
          if old in s: s=s.replace(old,new,1)
          old = '''        try:\n            draft = llm.draft_finding('''
          new = '''        if on_progress:\n            on_progress({\n                "program": handle,\n                "target": target,\n                "phase": "drafting_report",\n                "detail": "Building an evidence-grounded candidate report",\n                "planned_targets": len(selected_assets),\n                "completed_targets": index,\n                "evidence_collected": len(evidence_json),\n            })\n\n        try:\n            draft = llm.draft_finding('''
          if old in s: s=s.replace(old,new,1)
          worker.write_text(s)

          dashboard = Path('public/index.html')
          s = dashboard.read_text()
          pattern = r'async function pollResearchJob\(jobId\)\{.*?\n\}\n\nasync function logout'
          replacement = '''async function pollResearchJob(jobId){\n  const status=document.getElementById("researchStatus");\n  const started=Date.now();\n  const timeoutMs=30*60*1000;\n  for(;;){\n    const job=await request("/api/research/jobs/"+encodeURIComponent(jobId));\n    const p=job.progress||{};\n    const pct=p.planned_targets ? Math.floor((100*p.completed_targets)/p.planned_targets) : 0;\n    const phase=p.phase||"running";\n    const detail=p.detail||"Working";\n    if(job.status==="queued"){\n      status.textContent="Research queued…\\nJob: "+jobId;\n    }else if(job.status==="running"){\n      status.textContent=["Bounty research running","Job: "+jobId,"Phase: "+phase,"Detail: "+detail,"Program: "+(p.program||"—"),"Target: "+(p.target||"—"),"Progress: "+(p.completed_targets||0)+"/"+(p.planned_targets||"—")+" targets ("+pct+"%)","Evidence collected: "+(p.evidence_collected||0)].join("\\n");\n    }else if(job.status==="completed"){\n      const r=job.result||{};\n      status.textContent=["Research completed","Targets: "+(r.researched_targets||0),"Candidates: "+(r.created_findings||0),"Open the Queue below for the report candidate.","If candidates=0, the run completed honestly without inventing a vulnerability."].join("\\n");\n      await load();\n      return r;\n    }else if(job.status==="error"){\n      throw new Error(job.error||((job.result||{}).error)||"Research job failed without a reported error.");\n    }\n    if(Date.now()-started>timeoutMs) throw new Error("Research job exceeded the dashboard timeout; inspect the worker error/progress instead of waiting indefinitely.");\n    await new Promise(function(resolve){setTimeout(resolve,3000);});\n  }\n}\n\nasync function logout'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n: dashboard.write_text(s2)

          tests = Path('tests/test_bounded_research_execution.py')
          tests.write_text('''from pathlib import Path\n\nREPO = Path(__file__).resolve().parents[1]\n\n\ndef test_research_target_deadline_is_enforced():\n    source = (REPO / "src/h1_agent/research.py").read_text(encoding="utf-8")\n    assert "self._deadline" in source\n    assert "research_target_timeout_seconds" in source\n    assert "_request_timeout" in source\n\n\ndef test_worker_passes_toolchain_limits_and_reports_phases():\n    source = (REPO / "src/h1_agent/worker.py").read_text(encoding="utf-8")\n    assert "httpx_timeout=settings.toolchain_httpx_timeout_seconds" in source\n    assert "katana_timeout=settings.toolchain_katana_timeout_seconds" in source\n    assert "nuclei_timeout=settings.toolchain_nuclei_timeout_seconds" in source\n    assert '"phase": "finding_evidence"' in source\n    assert '"phase": "triaging_evidence"' in source\n    assert '"phase": "drafting_report"' in source\n\n\ndef test_dashboard_has_phase_aware_research_polling():\n    source = (REPO / "public/index.html").read_text(encoding="utf-8")\n    assert 'const phase=p.phase||"running"' in source\n    assert "Research job exceeded the dashboard timeout" in source\n''', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/h1_agent/research.py src/h1_agent/worker.py public/index.html tests/test_bounded_research_execution.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix bounded research execution and progress [repair-loop]"
          git push
      - name: Remove temporary repair workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/repair-loop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore remove temporary repair workflow [repair-loop]"
          git push
