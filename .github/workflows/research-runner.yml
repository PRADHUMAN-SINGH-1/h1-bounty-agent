name: H1 Research Trigger

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-runner.yml"

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      H1_AGENT_URL: ${{ secrets.H1_AGENT_URL || secrets.RENDER_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.H1_CRON_SECRET }}
    steps:
      - name: Validate Render trigger secrets
        run: |
          set -euo pipefail
          test -n "$H1_AGENT_URL"
          test -n "$CRON_SECRET"

      - name: Trigger Render bounty worker
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             --max-time 30             -H "Authorization: Bearer $CRON_SECRET"             "$H1_AGENT_URL/api/cron"
