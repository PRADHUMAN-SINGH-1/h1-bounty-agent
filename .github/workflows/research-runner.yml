name: H1 Research Trigger

# Autonomous hunt loop: trigger the deployed worker, then inspect its persisted findings.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-runner.yml"
      - "render.yaml"
      - "api/index.py"

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      H1_AGENT_URL: ${{ secrets.H1_AGENT_URL || secrets.RENDER_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.H1_CRON_SECRET }}
    steps:
      - name: Validate Render trigger secrets
        run: |
          set -euo pipefail
          test -n "$H1_AGENT_URL"
          test -n "$CRON_SECRET"

      - name: Trigger Render bounty worker
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            response=$(curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$H1_AGENT_URL/api/cron")
            echo "$response"
            if echo "$response" | grep -q '"mode":"autonomous-hunt"'; then
              break
            fi
            if echo "$response" | grep -q '"mode":"queued-job"'; then
              break
            fi
            sleep 30
          done

      - name: Poll for a persisted bounty report
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            response=$(curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$H1_AGENT_URL/api/cron/findings")
            echo "$response" > /tmp/findings.json
            python - <<'PY'
            import json
            from pathlib import Path
            payload=json.loads(Path('/tmp/findings.json').read_text())
            findings=payload.get('findings') or []
            print(f"persisted findings: {len(findings)}")
            for finding in findings:
                state=str(finding.get('state') or '')
                title=str(finding.get('title') or '').strip()
                evidence=finding.get('evidence') or []
                if state in {'needs_review','approved','submitted'} and title and evidence:
                    print(json.dumps(finding, ensure_ascii=False, indent=2))
                    raise SystemExit(0)
            raise SystemExit(1)
            PY
            if [ $? -eq 0 ]; then
              echo "A report candidate with evidence was persisted."
              exit 0
            fi
            sleep 30
          done
          echo "Autonomous hunt completed its verification window without a persisted evidence-backed report candidate."
          exit 1
