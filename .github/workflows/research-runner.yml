name: H1 Research Trigger
# current autonomous hunt trigger
# objective: find any evidence-backed, current, payable bounty (Low/Medium/High/Critical).
# hunt kickoff: continue until any evidence-backed, bounty-eligible candidate is found or the run ends.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-runner.yml"
      - "render.yaml"
      - "api/index.py"
      - "src/h1_agent/config.py"
      - "src/h1_agent/worker.py"
      - "src/h1_agent/hackerone.py"
      - "src/h1_agent/llm.py"
      - "src/h1_agent/postgres_store.py"
      - "src/h1_agent/store.py"

concurrency:
  group: h1-autonomous-hunt
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      statuses: write
    env:
      H1_AGENT_URL: ${{ secrets.H1_AGENT_URL || secrets.RENDER_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.H1_CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate Render trigger secrets
        run: |
          set -euo pipefail
          test -n "$H1_AGENT_URL"
          test -n "$CRON_SECRET"

      - name: Verify deployed release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            version=$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/version" 2>/tmp/version.err || true)
            echo "deployed release: $version"
            commit=$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("commit", ""))' <<<"$version" 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Render has not deployed GITHUB_SHA=$GITHUB_SHA."
          exit 1

      - name: Snapshot existing findings
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/findings" > /tmp/baseline-findings.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/baseline-findings.json", encoding="utf-8"))
          ids = {str(item.get("id")) for item in payload.get("findings") or [] if item.get("id") is not None}
          open("/tmp/baseline-finding-ids", "w", encoding="utf-8").write("\n".join(sorted(ids)))
          PY

      - name: Trigger Render bounty worker
        run: |
          set -euo pipefail
          response=""
          for attempt in $(seq 1 10); do
            response=$(curl --fail-with-body --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron")
            echo "$response"
            job_id=$(python -c 'import json,sys; p=json.loads(sys.stdin.read()); print(p.get("job_id") or p.get("id") or "")' <<<"$response" 2>/dev/null || true)
            if [ -n "$job_id" ]; then
              printf '%s' "$job_id" > /tmp/research-job-id
              printf '%s\n' "$response" > /tmp/research-response.json
              exit 0
            fi
            sleep 30
          done
          echo "The autonomous research trigger did not return a persisted job id."
          exit 1

      - name: Poll persisted research job and report queue
        run: |
          set -u
          job_id=$(cat /tmp/research-job-id)
          for attempt in $(seq 1 120); do
            job=$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/research/jobs/$job_id" 2>/tmp/job.err || true)
            echo "research job: $job"

            if printf '%s' "$job" | grep -q '"status":"error"'; then
              echo "Autonomous research job failed."
              exit 1
            fi

            findings=$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/findings" 2>/tmp/findings.err || true)
            if printf '%s' "$findings" | grep -q '"findings"'; then
              printf '%s\n' "$findings" > /tmp/findings.json
              if python - <<'PY'
          import json
          before = set(open("/tmp/baseline-finding-ids", encoding="utf-8").read().split())
          payload = json.load(open("/tmp/findings.json", encoding="utf-8"))
          required = ("title", "summary", "impact", "reproduction", "evidence", "structured_scope_id")
          meta_required = ("asset_identifier", "affected_component", "observed_behavior", "expected_behavior")
          chosen = None
          for f in payload.get("findings") or []:
              m = f.get("metadata") or {}
              valid = (
                  str(f.get("id")) not in before
                  and str(f.get("state")) in {"needs_review", "approved", "submitted"}
                  and str(f.get("severity") or "").lower() in {"low", "medium", "high", "critical", "none"}
                  and all(str(f.get(k) or "").strip() for k in required)
                  and isinstance(f.get("reproduction"), list) and bool(f.get("reproduction"))
                  and isinstance(f.get("evidence"), list) and bool(f.get("evidence"))
                  and all(str(m.get(k) or "").strip() for k in meta_required)
                  and not m.get("missing_validation")
              )
              if valid:
                  chosen = f
                  break
          print("new payable report-ready candidate:", bool(chosen))
          if chosen:
              print(json.dumps(chosen))
          raise SystemExit(0 if chosen else 1)
          PY
              then
                cat /tmp/findings.json
                printf '%s\n' "payable" > /tmp/hunt-result
                exit 0
              fi
            fi

            status=$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("status", "unknown"))' <<<"$job" 2>/dev/null || echo unknown)
            if [ "$status" = "completed" ]; then
              echo "Research completed without an evidence-backed payable candidate; the next scheduled run will try again."
              printf '%s\n' "none" > /tmp/hunt-result
              exit 1
            fi
            sleep 30
          done
          echo "Research verification window expired without an evidence-backed payable candidate."
          printf '%s\n' "timeout" > /tmp/hunt-result
          exit 1

      - name: Publish hunt status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          result="unknown"
          if [ -f /tmp/hunt-result ]; then
            result=$(cat /tmp/hunt-result)
          fi
          case "$result" in
            payable)
              state="success"
              description="Evidence-backed payable report-ready candidate found"
              ;;
            none)
              state="failure"
              description="No evidence-backed payable candidate in this run"
              ;;
            timeout)
              state="error"
              description="Hunt timed out without a payable candidate"
              ;;
            *)
              state="error"
              description="Hunt ended without a definitive result"
              ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -f state="$state"             -f context="H1 Paid Bounty Hunt"             -f description="$description"             -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
