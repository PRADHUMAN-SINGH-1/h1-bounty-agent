name: H1 Research Trigger

# Autonomous hunt loop: trigger the deployed worker, then inspect its persisted job state.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-runner.yml"
      - "render.yaml"

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      H1_AGENT_URL: ${{ secrets.H1_AGENT_URL || secrets.RENDER_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.H1_CRON_SECRET }}
    steps:
      - name: Validate Render trigger secrets
        run: |
          set -euo pipefail
          test -n "$H1_AGENT_URL"
          test -n "$CRON_SECRET"

      - name: Trigger Render bounty worker
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            response=$(curl --fail-with-body --silent --show-error \
              --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$H1_AGENT_URL/api/cron")
            echo "$response"
            if echo "$response" | grep -q '"mode":"autonomous-hunt"'; then
              exit 0
            fi
            if echo "$response" | grep -q '"mode":"queued-job"'; then
              exit 0
            fi
            sleep 30
          done
          echo "Worker did not accept an autonomous/queued research job within the retry window."
          exit 1
