name: H1 Research Trigger

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-runner.yml"
      - "render.yaml"
      - "api/index.py"
      - "src/h1_agent/config.py"
      - "src/h1_agent/worker.py"
      - "src/h1_agent/hackerone.py"
      - "src/h1_agent/llm.py"
      - "src/h1_agent/postgres_store.py"
      - "src/h1_agent/store.py"

concurrency:
  group: h1-autonomous-hunt
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    env:
      H1_AGENT_URL: ${{ secrets.H1_AGENT_URL || secrets.RENDER_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.H1_CRON_SECRET }}

    steps:
      - name: Validate trigger secrets
        run: |
          set -euo pipefail
          test -n "$H1_AGENT_URL"
          test -n "$CRON_SECRET"

      - name: Verify deployed release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            version=$(curl --fail-with-body --silent --show-error --max-time 15 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/version" 2>/tmp/version.err || true)
            echo "deployed release: $version"
            commit=$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("commit", ""))' <<<"$version" 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 5
          done
          echo "Render has not deployed $GITHUB_SHA."
          exit 1

      - name: Snapshot findings
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/findings" > /tmp/baseline-findings.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/baseline-findings.json", encoding="utf-8"))
          ids = {str(item.get("id")) for item in payload.get("findings") or [] if item.get("id") is not None}
          open("/tmp/baseline-finding-ids", "w", encoding="utf-8").write("\n".join(sorted(ids)))
          PY

      - name: Start full autonomous hunt
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron")
          echo "$response"
          job_id=$(python -c 'import json,sys; p=json.loads(sys.stdin.read()); print(p.get("job_id") or p.get("id") or "")' <<<"$response")
          test -n "$job_id"
          printf '%s' "$job_id" > /tmp/research-job-id

      - name: Wait until full report exists
        run: |
          set -u
          job_id=$(cat /tmp/research-job-id)
          for attempt in $(seq 1 32); do
            job=$(curl --fail-with-body --silent --show-error --max-time 20 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/research/jobs/$job_id" 2>/tmp/job.err || true)
            echo "research job: $job"
            findings=$(curl --fail-with-body --silent --show-error --max-time 20 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/findings" 2>/tmp/findings.err || true)
            candidate=$(python -c 'import json,sys; b=set(open("/tmp/baseline-finding-ids",encoding="utf-8").read().split()); p=json.loads(sys.stdin.read()); print("yes" if any(str(f.get("id")) not in b and str(f.get("state")) in {"needs_review","approved","submitted"} and str(f.get("severity") or "").lower() in {"low","medium","high","critical"} and all(str(f.get(k) or "").strip() for k in ("title","summary","impact","reproduction","evidence","structured_scope_id")) and isinstance(f.get("reproduction"),list) and bool(f["reproduction"]) and isinstance(f.get("evidence"),list) and bool(f["evidence"]) and all(str((f.get("metadata") or {}).get(k) or "").strip() for k in ("asset_identifier","affected_component","preconditions","observed_behavior","expected_behavior","attack_scenario","remediation","cvss_score","cvss_vector","report_markdown")) and (f.get("metadata") or {}).get("weakness_id") is not None and not (f.get("metadata") or {}).get("missing_validation") for f in p.get("findings") or []) else "no")' <<<"$findings" 2>/dev/null || echo no)
            echo "full report candidate: $candidate"
            if [ "$candidate" = "yes" ]; then
              exit 0
            fi
            status=$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("status","unknown"))' <<<"$job" 2>/dev/null || echo unknown)
            if [ "$status" = "completed" ] || [ "$status" = "error" ]; then
              echo "Research ended without a complete report."
              exit 1
            fi
            sleep 15
          done
          echo "Ten-minute report-generation window expired without a complete report."
          exit 1
