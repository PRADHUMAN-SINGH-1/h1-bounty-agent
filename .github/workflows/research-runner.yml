name: H1 Research Trigger
# current autonomous hunt trigger
# hunt kickoff: continue until a high/critical evidence-backed candidate is found or the run ends.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-runner.yml"
      - "render.yaml"
      - "api/index.py"
      - "src/h1_agent/config.py"
      - "src/h1_agent/worker.py"
      - "src/h1_agent/hackerone.py"
      - "src/h1_agent/llm.py"
      - "src/h1_agent/postgres_store.py"
      - "src/h1_agent/store.py"

concurrency:
  group: h1-autonomous-hunt
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      H1_AGENT_URL: ${{ secrets.H1_AGENT_URL || secrets.RENDER_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.H1_CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate Render trigger secrets
        run: |
          set -euo pipefail
          test -n "$H1_AGENT_URL"
          test -n "$CRON_SECRET"

      - name: Verify deployed release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            version=$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/version" 2>/tmp/version.err || true)
            echo "deployed release: $version"
            commit=$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("commit", ""))' <<<"$version" 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Render has not deployed GITHUB_SHA=$GITHUB_SHA."
          exit 1

      - name: Trigger Render bounty worker
        run: |
          set -euo pipefail
          response=""
          for attempt in $(seq 1 10); do
            response=$(curl --fail-with-body --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron")
            echo "$response"
            job_id=$(python -c 'import json,sys; p=json.loads(sys.stdin.read()); print(p.get("job_id") or p.get("id") or "")' <<<"$response" 2>/dev/null || true)
            if [ -n "$job_id" ]; then
              printf '%s' "$job_id" > /tmp/research-job-id
              printf '%s\n' "$response" > /tmp/research-response.json
              exit 0
            fi
            sleep 30
          done
          echo "The autonomous research trigger did not return a persisted job id."
          exit 1

      - name: Poll persisted research job and report queue
        run: |
          set -u
          job_id=$(cat /tmp/research-job-id)
          for attempt in $(seq 1 120); do
            job=$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/research/jobs/$job_id" 2>/tmp/job.err || true)
            echo "research job: $job"

            if printf '%s' "$job" | grep -q '"status":"error"'; then
              echo "Autonomous research job failed."
              exit 1
            fi

            findings=$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/findings" 2>/tmp/findings.err || true)
            if printf '%s' "$findings" | grep -q '"findings"'; then
              printf '%s\n' "$findings" > /tmp/findings.json
              if python -c 'import json; p=json.load(open("/tmp/findings.json")); ok=any(str(f.get("state")) in {"needs_review","approved","submitted"} and str(f.get("severity") or "").lower() in {"high","critical"} and str(f.get("title") or "").strip() and f.get("evidence") for f in p.get("findings") or []); print("high-or-critical evidence-backed candidate:", ok); raise SystemExit(0 if ok else 1)'; then
                cat /tmp/findings.json
                exit 0
              fi
            fi

            status=$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("status", "unknown"))' <<<"$job" 2>/dev/null || echo unknown)
            if [ "$status" = "completed" ]; then
              echo "Research completed without a high/critical evidence-backed report candidate; the next scheduled run will try again."
              exit 1
            fi
            sleep 30
          done
          echo "Research verification window expired without an evidence-backed report candidate."
          exit 1
