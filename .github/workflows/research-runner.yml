name: H1 Research Trigger

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-runner.yml"
      - "render.yaml"
      - "api/index.py"

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      H1_AGENT_URL: ${{ secrets.H1_AGENT_URL || secrets.RENDER_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.H1_CRON_SECRET }}
    steps:
      - name: Validate Render trigger secrets
        run: |
          set -euo pipefail
          test -n "$H1_AGENT_URL"
          test -n "$CRON_SECRET"

      - name: Trigger Render bounty worker
        run: |
          set -euo pipefail
          accepted=0
          for attempt in $(seq 1 10); do
            response=$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron")
            echo "$response"
            if echo "$response" | grep -q '"mode":"autonomous-hunt"'; then accepted=1; break; fi
            if echo "$response" | grep -q '"mode":"queued-job"'; then accepted=1; break; fi
            sleep 30
          done
          test "$accepted" -eq 1

      - name: Poll for a persisted evidence-backed report
        run: |
          set -u
          for attempt in $(seq 1 36); do
            response=$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$H1_AGENT_URL/api/cron/findings" 2>/tmp/findings.err || true)
            if printf '%s' "$response" | grep -q '"findings"'; then
              printf '%s\n' "$response" > /tmp/findings.json
              if python -c 'import json; p=json.load(open("/tmp/findings.json")); ok=any(str(f.get("state")) in {"needs_review","approved","submitted"} and str(f.get("title") or "").strip() and f.get("evidence") for f in p.get("findings") or []); print("evidence-backed report candidate:", ok); raise SystemExit(0 if ok else 1)'; then
                cat /tmp/findings.json
                exit 0
              fi
            else
              echo "findings endpoint not ready yet"
              cat /tmp/findings.err || true
            fi
            sleep 30
          done
          echo "No evidence-backed report candidate was persisted during the verification window."
          exit 1
