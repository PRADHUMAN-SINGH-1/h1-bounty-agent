name: Superhuman Docs Auth Normalization Hunt

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/docs_normalization_auth_hunt.py
      - .github/workflows/docs-normalization-auth-hunt.yml

permissions:
  contents: read

jobs:
  normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test path normalization variants
        run: python scripts/docs_normalization_auth_hunt.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: docs-normalization-auth-evidence
          path: |
            docs-normalization-auth-results.json
            docs-normalization-auth-report.md