name: Files.com Unauthenticated API Authorization Sweep

on:
  push:
    paths:
      - ".github/workflows/files-api-unauth-sweep.yml"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: https://app.files.com
    steps:
      - name: Run bounded unauthenticated authorization sweep
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, subprocess, time
          from pathlib import Path

          base = "https://app.files.com"
          targets = [
              ("users","/api/rest/v1/users.json"),
              ("permissions","/api/rest/v1/permissions.json"),
              ("api_keys","/api/rest/v1/api_keys.json"),
              ("custom_domains","/api/rest/v1/custom_domains.json"),
              ("workspaces","/api/rest/v1/workspaces.json"),
              ("event_targets","/api/rest/v1/event_targets.json"),
              ("history","/api/rest/v1/history.json"),
              ("sso_events","/api/rest/v1/sso_events.json"),
              ("sftp_host_keys","/api/rest/v1/sftp_host_keys.json"),
              ("user_lifecycle_rules","/api/rest/v1/user_lifecycle_rules.json"),
              ("remote_servers","/api/rest/v1/remote_servers.json"),
              ("public_keys","/api/rest/v1/public_keys.json"),
              ("bundle_downloads","/api/rest/v1/bundle_downloads.json"),
              ("groups","/api/rest/v1/groups.json"),
          ]
          sensitive = re.compile(r'(?i)(api[_-]?key|access[_-]?token|refresh[_-]?token|private[_-]?key|password|secret|session[_-]?id|user[_-]?id|email|workspace[_-]?id|owner[_-]?id|site[_-]?id)')
          rows=[]
          for name, path in targets:
              url = base + path
              p = subprocess.run(["curl","-sS","--max-redirs","0","--connect-timeout","8","--max-time","15","-D","/tmp/h","-o","/tmp/b",url], text=True, capture_output=True)
              h = Path("/tmp/h").read_text(errors="replace") if Path("/tmp/h").exists() else ""
              b = Path("/tmp/b").read_text(errors="replace") if Path("/tmp/b").exists() else ""
              statuses = re.findall(r"^HTTP/[^ ]+\s+(\d+)", h, re.M)
              status = int(statuses[-1]) if statuses else 0
              ct = next((z.split(":",1)[1].strip() for z in h.splitlines() if z.lower().startswith("content-type:")), "")
              row={"endpoint":name,"url":url,"status":status,"content_type":ct,"length":len(b),"body_sha256":hashlib.sha256(b.encode()).hexdigest() if b else "","json":False,"json_type":None,"record_count":None,"sensitive_field_hits":[]}
              try:
                  data=json.loads(b)
                  row["json"]=True
                  row["json_type"]=type(data).__name__
                  if isinstance(data,list):
                      row["record_count"]=len(data)
                      sample=json.dumps(data[:3],ensure_ascii=False)[:120000]
                  else:
                      sample=json.dumps(data,ensure_ascii=False)[:120000]
                  row["sensitive_field_hits"]=sorted(set(m.group(1).lower() for m in sensitive.finditer(sample)))[:20]
              except Exception:
                  row["sensitive_field_hits"]=sorted(set(m.group(0).lower() for m in sensitive.finditer(b[:120000])))[:20]
              rows.append(row)
              print(json.dumps(row,ensure_ascii=False))
              time.sleep(1.05)
          Path("files-unauth-api-sweep.json").write_text(json.dumps(rows,indent=2)+"\n")
          protected={"users","permissions","api_keys","custom_domains","workspaces","event_targets","history","sso_events","sftp_host_keys","user_lifecycle_rules","remote_servers","public_keys","bundle_downloads","groups"}
          candidates=[r for r in rows if r["endpoint"] in protected and 200 <= r["status"] < 300 and r["length"] > 0 and (r["record_count"] is None or r["record_count"] > 0) and r["json"]]
          if candidates:
              c=candidates[0]
              Path("files-api-unauth-report.md").write_text("Potential unauthenticated Files.com API authorization bypass\n\nTarget: "+c["url"]+"\n\nObserved: HTTP "+str(c["status"])+" without an authentication header, with a non-empty JSON response.\n\nEvidence: response length "+str(c["length"])+" bytes; response SHA256 "+c["body_sha256"]+".\n\nCurrent authorization documentation and the exact returned record must be reviewed before submission.\n")
              print("UNAUTHENTICATED_API_CANDIDATE")
          else:
              Path("files-api-unauth-report.md").write_text("# NO VERIFIED UNAUTHENTICATED API BYPASS\n\nNo tested protected endpoint returned a non-empty JSON record set to an unauthenticated request.\n")
              print("NO_UNAUTHENTICATED_API_CANDIDATE")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-api-unauthenticated-sweep
          path: |
            files-unauth-api-sweep.json
            files-api-unauth-report.md