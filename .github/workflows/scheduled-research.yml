name: Scheduled H1 Research

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger research cycle
        env:
          H1_AGENT_URL: ${{ secrets.H1_AGENT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$H1_AGENT_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CRON_SECRET"             "$H1_AGENT_URL/api/cron"
