name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m h1_agent.cli --help
      - name: Dashboard JavaScript syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("public/index.html").read_text()
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/dashboard.js").write_text(script)
          PY
          node --check /tmp/dashboard.js

      - name: Live in-scope proof checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python - <<'PY'
          import json, subprocess
          from urllib.parse import quote
          canary = 'https://h1-proof-canary.invalid/'
          tests = [
              ('grammarly_a_target', 'https://www.grammarly.com/a?target=' + quote(canary, safe='')),
              ('grammarly_logout', 'https://www.grammarly.com/logout?redirect_to=' + quote(canary, safe='')),
              ('grammarly_redirect', 'https://www.grammarly.com/?redirect=' + quote(canary, safe='')),
              ('superhuman_next', 'https://superhuman.com/?next=' + quote(canary, safe='')),
              ('settings_redirect', 'https://settings.superhuman.com/?redirect=' + quote(canary, safe='')),
              ('id_redirect', 'https://id.superhuman.com/?redirect=' + quote(canary, safe='')),
          ]
          out=[]
          for name,url in tests:
              p=subprocess.run(['curl','-sS','--max-redirs','0','--connect-timeout','8','--max-time','15','-o','/tmp/body','-D','-',url],text=True,capture_output=True)
              lines=p.stdout.splitlines()
              status=next((z for z in lines if z.startswith('HTTP/')), '')
              location=next((z.split(':',1)[1].strip() for z in lines if z.lower().startswith('location:')), '')
              item={'test':name,'url':url,'status':status,'location':location,'exit_code':p.returncode,'external_redirect_proof':location.startswith(canary)}
              print(json.dumps(item))
              out.append(item)
          json.dump(out,open('live-proof-results.json','w'),indent=2)
          PY

      - name: Generate report from demonstrated proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.load(open('live-proof-results.json'))
          hits=[x for x in rows if x['external_redirect_proof']]
          if not hits:
              Path('verified-report.md').write_text('# NO VERIFIED BOUNTY EVIDENCE\n\nNo tested in-scope URL redirected to the controlled external canary.\n')
          else:
              x=hits[0]
              Path('verified-report.md').write_text(                  '# Verified open redirect proof\n\n'                  + 'Program: Superhuman (formerly Grammarly)\n'                  + f"Affected asset: {x['url'].split('?',1)[0]}\n\n"                  + '## Summary\nA public endpoint accepted an attacker-controlled external destination and returned it as the HTTP Location header.\n\n'                  + '## Reproduction\n'                  + f"1. Send GET `{x['url']}` without following redirects.\n2. Observe `{x['status']}` and `Location: {x['location']}`.\n\n"                  + '## Expected behavior\nExternal redirect destinations should be constrained to intended/allowlisted destinations.\n\n'                  + '## Evidence\n'                  + f"- Tested URL: `{x['url']}`\n- HTTP status: `{x['status']}`\n- Location: `{x['location']}`\n- Controlled canary: `https://h1-proof-canary.invalid/`\n"              )
          PY

      - name: Upload live proof report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: live-proof-report
          path: |
            live-proof-results.json
            verified-report.md

      - name: CTF document proof check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        continue-on-error: true
        run: |
          set -u
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          urls = [
              'https://app.grammarly.com/ddocs/1198436185',
              'https://www.grammarly.com/ddocs/1198436185',
              'https://docs.superhuman.com/ddocs/1198436185',
              'https://app.coda.io/d/1198436185',
              'https://coda.io/d/1198436185',
          ]
          rows=[]
          for url in urls:
              p=subprocess.run(['curl','-sS','-L','--max-redirs','5','--connect-timeout','8','--max-time','20','-D','/tmp/headers','-o','/tmp/body',url],text=True,capture_output=True)
              body=Path('/tmp/body').read_text(errors='replace') if Path('/tmp/body').exists() else ''
              headers=Path('/tmp/headers').read_text(errors='replace') if Path('/tmp/headers').exists() else ''
              status=next((x for x in headers.splitlines() if x.startswith('HTTP/')), '')
              title=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
              title_text=re.sub(r'\s+',' ',title.group(1)).strip()[:300] if title else ''
              hits=[]
              for pat in [r'\$FLAG\s*[:=]\s*[^<\s]{4,200}',r'FLAG\{[^}]{4,200}\}',r'H1\{[^}]{4,200}\}']:
                  hits.extend(re.findall(pat,body,re.I))
              row={'url':url,'status':status,'title':title_text,'body_length':len(body),'flag_hits':sorted(set(hits))[:10],'exit_code':p.returncode}
              rows.append(row)
              print(json.dumps(row,ensure_ascii=False))
          Path('ctf-proof.json').write_text(json.dumps(rows,indent=2))
          hits=[x for x in rows if x['flag_hits']]
          if hits:
              x=hits[0]
              report=('''# Superhuman CTF document exposure\n\n## Program\nSuperhuman (formerly Grammarly)\n\n## Summary\nThe in-scope CTF document identified by document ID 1198436185 was retrievable without authentication and its response contained the challenge flag.\n\n## Reproduction\n1. Request `%s` without authentication.\n2. Follow redirects.\n3. Inspect the response body for the challenge flag.\n\n## Evidence\n- URL: `%s`\n- HTTP status: `%s`\n- Response length: `%s` bytes\n- Flag evidence: `%s`\n''' % (x['url'],x['url'],x['status'],x['body_length'],x['flag_hits'][0]))
              Path('ctf-bounty-report.md').write_text(report)
          else:
              Path('ctf-bounty-report.md').write_text('# NO VERIFIED CTF EVIDENCE\n\nThe challenge document was tested without authentication; no flag pattern was exposed in the retrieved public responses.\n')
          PY

      - name: Upload CTF proof report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ctf-proof-report
          path: |
            ctf-proof.json
            ctf-bounty-report.md
