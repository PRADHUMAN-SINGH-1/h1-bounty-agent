name: Next.js 16.3.6 Standalone Trace Exposure

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nextjs-standalone-trace.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create minimal Next.js application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/next-trace-test
          mkdir -p /tmp/next-trace-test/app /tmp/next-trace-test/node_modules/some-pkg
          cd /tmp/next-trace-test
          cat > package.json <<'EOF'
          {"private":true,"scripts":{"build":"next build --turbopack"},"dependencies":{"next":"16.3.6","react":"19.1.1","react-dom":"19.1.1"}}
          EOF
          cat > next.config.js <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = { output: 'standalone' }
          module.exports = nextConfig
          EOF
          cat > app/page.js <<'EOF'
          import somePkg from 'some-pkg'
          export default function Page() {
            return <main>{somePkg.value}</main>
          }
          EOF
          npm install --ignore-scripts
          mkdir -p node_modules/some-pkg
          cat > node_modules/some-pkg/package.json <<'EOF'
          {"name":"some-pkg","version":"1.0.0","main":"index.js"}
          EOF
          cat > node_modules/some-pkg/index.js <<'EOF'
          const path = require('path')
          function resolve(dir) {
            return path.resolve(dir || '.')
          }
          resolve(process.env.H1_ADDON_DIR)
          module.exports = { value: 'ok' }
          EOF
          cat > app-owned-private.txt <<'EOF'
          H1_SYNTHETIC_SECRET_DO_NOT_TRACE
          EOF
          echo '=== versions ==='
          node -v
          npx next --version

      - name: Build with Turbopack
        shell: bash
        working-directory: /tmp/next-trace-test
        run: |
          set -euo pipefail
          npm run build

      - name: Prove whether application-owned secret entered trace
        shell: bash
        working-directory: /tmp/next-trace-test
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path(".next/standalone")
          secret=b"H1_SYNTHETIC_SECRET_DO_NOT_TRACE"
          copied=[p for p in root.rglob("*") if p.is_file() and p.name=="app-owned-private.txt"]
          print("COPIED_PRIVATE_FILES=", [str(p) for p in copied])
          nft_hits=[]
          for p in Path(".next").rglob("*.nft.json"):
              try:
                  data=p.read_bytes()
              except OSError:
                  continue
              if b"app-owned-private.txt" in data:
                  nft_hits.append(str(p))
          print("NFT_REFERENCES=", nft_hits)
          content_hits=[]
          for p in copied:
              try:
                  if secret in p.read_bytes():
                      content_hits.append(str(p))
              except OSError:
                  pass
          print("SECRET_CONTENT_HITS=", content_hits)
          if copied or nft_hits or content_hits:
              Path("verified-bounty-evidence.md").write_text(
                  "# VERIFIED TRACE EXPOSURE\n\n"
                  "Next.js 16.3.6 Turbopack standalone output or NFT trace includes "
                  "the application-owned synthetic private file after a dependency "
                  "uses path.resolve(dir || '.') with an unresolved environment variable.\n"
              )
              raise SystemExit(42)
          Path("verified-bounty-evidence.md").write_text(
              "# NO VERIFIED TRACE EXPOSURE\n\n"
              "No standalone/NFT reference to app-owned-private.txt was found.\n"
          )
          PY
