name: Files.com Public Hosting Isolation Probe

on:
  push:
    paths:
      - ".github/workflows/files-public-hosting-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Probe assigned Public Hosting security boundary
        shell: bash
        run: |
          set -euo pipefail

          host="https://bugbountytrialcompany1219.hosted-by-files.com"
          paths=(
            "/"
            "/robots.txt"
            "/favicon.ico"
            "/../"
            "/%2e%2e/"
            "/.%2e/"
            "//"
            "/%2f"
            "/%2e/"
            "/.well-known/"
          )

          : > public-hosting-isolation.jsonl
          candidate=0

          for path in "${paths[@]}"; do
            url="$host$path"
            curl -sS --max-redirs 0 --connect-timeout 7 --max-time 12               -A "H1-Bounty-Agent/FilesCom-PublicHosting/1.0"               -H "Accept: */*"               -D /tmp/ph-headers -o /tmp/ph-body               -w "status=%{http_code} bytes=%{size_download}\n"               "$url" > /tmp/ph-status || true

            status=$(awk -F= '{print $2}' /tmp/ph-status | awk '{print $1}')
            bytes=$(awk -F= '{print $3}' /tmp/ph-status)
            sha=$(sha256sum /tmp/ph-body 2>/dev/null | cut -d' ' -f1 || true)
            ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^content-type:[[:space:]]*/,""); print; exit}' /tmp/ph-headers 2>/dev/null || true)
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^location:[[:space:]]*/,""); print; exit}' /tmp/ph-headers 2>/dev/null || true)

            printf '{"path":"%s","status":%s,"bytes":%s,"content_type":"%s","location":"%s","sha256":"%s"}\n'               "$path" "$status" "$bytes" "$ctype" "$location" "$sha" | tee -a public-hosting-isolation.jsonl

            # Flag only a non-empty 2xx response from a traversal/boundary variant.
            if [[ "$path" == *".."* || "$path" == "//" || "$path" == "/%2f" ]]; then
              if [ "$status" -ge 200 ] && [ "$status" -lt 300 ] && [ "$bytes" -gt 0 ]; then
                echo "PUBLIC_HOSTING_BOUNDARY_CANDIDATE path=$path"
                head -c 1200 /tmp/ph-body || true
                echo
                candidate=1
                break
              fi
            fi

            rm -f /tmp/ph-body /tmp/ph-headers /tmp/ph-status
            sleep 1
          done

          if [ "$candidate" -eq 1 ]; then
            echo "candidate=true" > public-hosting-summary.txt
            exit 42
          fi

          echo "candidate=false" > public-hosting-summary.txt
          echo "NO_PUBLIC_HOSTING_BOUNDARY_CANDIDATE"

      - name: Upload public hosting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-public-hosting-isolation
          path: |
            public-hosting-isolation.jsonl
            public-hosting-summary.txt
