name: Kong Developer Unpublished Content Hunt
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/kong_developer_unpublished_hunt.py
      - .github/workflows/kong-developer-unpublished-hunt.yml
permissions:
  contents: read
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe public developer site
        run: python scripts/kong_developer_unpublished_hunt.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kong-developer-unpublished-evidence
          path: |
            kong-developer-unpublished-results.json
            kong-developer-unpublished-report.md