name: Files.com Extended Protected GET Sweep

on:
  push:
    paths:
      - ".github/workflows/files-extended-get-sweep.yml"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test extended REST resources without authentication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, subprocess, time
          from pathlib import Path

          base="https://app.files.com"
          resources=[
            "groups","gpg_keys","sync_runs","partners","clickwraps","as2_partners",
            "as2_stations","sso_strategies","sso_strategy","integration_centric_profiles",
            "key_lifecycle_rules","site_subdomain_redirects","ai_tasks",
            "ai_assistant_personalities","user_additional_email_recipients",
            "remote_mount_backends","file_comment_reactions","notifications",
            "metadata_categories","bandwidth_snapshots","usage_snapshots",
            "usage_daily_snapshots","event_records","file_migrations",
            "bundle_downloads","bundle_notifications","expectation_incidents",
            "expectations","expectation_evaluations","user_security_events",
            "pending_work_events","user_sftp_client_uses"
          ]
          rows=[]
          for name in resources:
            url=f"{base}/api/rest/v1/{name}.json"
            p=subprocess.run(
              ["curl","-sS","--max-redirs","0","--connect-timeout","6","--max-time","10",
               "-A","H1-Bounty-Agent/FilesCom-ExtendedGET/1.0",
               "-D","/tmp/h","-o","/tmp/b",url],
              text=True,capture_output=True
            )
            h=Path("/tmp/h").read_text(errors="replace") if Path("/tmp/h").exists() else ""
            b=Path("/tmp/b").read_text(errors="replace") if Path("/tmp/b").exists() else ""
            statuses=re.findall(r"^HTTP/[^ ]+\s+(\d+)",h,re.M)
            status=int(statuses[-1]) if statuses else 0
            ct=next((x.split(":",1)[1].strip() for x in h.splitlines() if x.lower().startswith("content-type:")),"")
            row={"resource":name,"url":url,"status":status,"content_type":ct,"bytes":len(b),"sha256":hashlib.sha256(b.encode()).hexdigest() if b else "","json":False,"record_count":None}
            try:
              data=json.loads(b); row["json"]=True
              if isinstance(data,list): row["record_count"]=len(data)
            except Exception: pass
            rows.append(row)
            print(json.dumps(row,ensure_ascii=False))
            time.sleep(0.35)

          Path("files-extended-get-sweep.json").write_text(json.dumps(rows,indent=2)+"\n")
          hits=[r for r in rows if 200 <= r["status"] < 300 and r["bytes"] > 0 and r["json"] and (r["record_count"] is None or r["record_count"] > 0)]
          # The previously confirmed public Apps catalogue is intentionally excluded from candidate generation.
          hits=[r for r in hits if r["resource"] != "apps"]
          if hits:
            h=hits[0]
            Path("files-extended-get-candidate.md").write_text(
              "# Candidate unauthenticated Files.com REST resource\n\n"
              f"Endpoint: {h['url']}\nHTTP status: {h['status']}\nResponse bytes: {h['bytes']}\n"
              f"Response SHA256: {h['sha256']}\nJSON record count: {h['record_count']}\n\n"
              "This is a validation candidate. Match the endpoint to its current authorization requirement before submission.\n"
            )
            raise SystemExit(42)
          Path("files-extended-get-candidate.md").write_text("# NO VERIFIED EXTENDED UNAUTHENTICATED REST EXPOSURE\n\nNo tested extended resource returned non-empty JSON records without authentication.\n")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-extended-get-sweep
          path: |
            files-extended-get-sweep.json
            files-extended-get-candidate.md
