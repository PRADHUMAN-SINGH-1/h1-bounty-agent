name: Kong MCP Public Surface Hunt
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/kong_mcp_public_hunt.py
      - .github/workflows/kong-mcp-public-hunt.yml
permissions:
  contents: read
jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe public MCP endpoints
        run: python scripts/kong_mcp_public_hunt.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kong-mcp-public-evidence
          path: |
            kong-mcp-public-results.json
            kong-mcp-public-report.md