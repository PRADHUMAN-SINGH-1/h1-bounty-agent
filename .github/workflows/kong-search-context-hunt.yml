name: Kong Search HTML Context Hunt
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/kong_search_context_hunt.py
      - .github/workflows/kong-search-context-hunt.yml
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test quote context
        run: python scripts/kong_search_context_hunt.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kong-search-context-evidence
          path: |
            kong-search-context-results.json
            kong-search-context-report.md