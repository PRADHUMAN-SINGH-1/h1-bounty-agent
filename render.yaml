services:
  - type: web
    name: h1-bounty-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install .
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: h1-bounty-agent-db
          property: connectionString

      - key: HACKERONE_USERNAME
        sync: false
      - key: HACKERONE_API_TOKEN
        sync: false
      - key: HACKERONE_BASE_URL
        value: https://api.hackerone.com

      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

      - key: DRY_RUN
        value: "true"
      - key: ALLOW_ACTIVE_TESTS
        value: "false"
      - key: ALLOW_AUTHZ_TESTS
        value: "false"
      - key: AUTHZ_HEADER_A
        sync: false
      - key: AUTHZ_HEADER_B
        sync: false
      - key: AUTHZ_MAX_ENDPOINTS
        value: "30"
      - key: ALLOW_STATE_CHANGING_TESTS
        value: "false"
      - key: H1_ENABLE_SUBMISSION
        value: "true"
      - key: REQUESTS_PER_SECOND
        value: "1"
      - key: SESSION_MAP_MAX_PAGES
        value: "40"
      - key: SESSION_MAP_MAX_DEPTH
        value: "2"
      - key: MUTATION_MAX_REQUESTS
        value: "3"
      - key: BROWSER_TRACE_MAX_REQUESTS
        value: "500"

      - key: AUTONOMOUS_RESEARCH
        value: "true"
      - key: AUTONOMOUS_PASSIVE_RESEARCH
        value: "false"
      - key: AUTONOMOUS_MAX_PROGRAMS
        value: "2"
      - key: AUTONOMOUS_MAX_TARGETS_PER_PROGRAM
        value: "1"
      - key: FULL_RESEARCH_MAX_TARGETS_PER_PROGRAM
        value: "50"
      - key: RESEARCH_TARGET_TIMEOUT_SECONDS
        value: "180"
      - key: DEEP_MAX_SCRIPTS
        value: "10"
      - key: DEEP_MAX_QUERY_LINKS
        value: "10"
      - key: DEEP_MAX_API_CANDIDATES
        value: "15"
      - key: DEEP_MAX_OPENAPI_STEPS
        value: "10"
      - key: DEEP_MAX_GRAPHQL_ENDPOINTS
        value: "5"
      - key: DEEP_MAX_WEBSOCKET_ENDPOINTS
        value: "5"
      - key: DEEP_MAX_CLOUD_TEXT_BYTES
        value: "4000000"
      - key: DEEP_MAX_PAGES
        value: "10"
      - key: DEEP_MAX_PAGE_LINKS
        value: "30"
      - key: TOOLCHAIN_ENABLED
        value: "true"
      - key: TOOLCHAIN_MAX_ROOTS
        value: "1"
      - key: TOOLCHAIN_MAX_TARGETS
        value: "5"
      - key: TOOLCHAIN_HTTPX_TIMEOUT_SECONDS
        value: "30"
      - key: TOOLCHAIN_KATANA_TIMEOUT_SECONDS
        value: "45"
      - key: TOOLCHAIN_NUCLEI_TIMEOUT_SECONDS
        value: "45"
      - key: RESEARCH_PROGRAM_ALLOWLIST
        value: ""

      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false

databases:
  - name: h1-bounty-agent-db
    plan: free
    region: singapore
