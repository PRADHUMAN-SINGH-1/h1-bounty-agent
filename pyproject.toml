[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "h1-bounty-agent"
version = "0.4.0"
description = "AI-assisted HackerOne research workspace with strict authorization and human validation gates"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "vercel>=0.11,<0.12",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
h1-agent = "h1_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
