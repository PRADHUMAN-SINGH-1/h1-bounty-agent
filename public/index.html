<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H1 Bounty Agent</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#070b12;color:#edf3fb;font-family:Inter,system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:32px 20px 60px}
.card{background:#111a29;border:1px solid #25354d;border-radius:16px;padding:18px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.metric{font-size:28px;font-weight:750}.muted{color:#8fa3bf}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{background:#182940;color:#fff;border:1px solid #304764;border-radius:10px;padding:10px 14px;cursor:pointer}
.primary{background:#71e0c0;color:#07110d;border:0}.danger{background:#ff7c89;color:#24080c;border:0}
input{display:block;width:100%;max-width:420px;margin:8px 0;padding:11px 12px;border-radius:10px;border:1px solid #304764;background:#0b1320;color:#fff}
.finding{margin-top:14px}.title{font-size:18px;font-weight:700}.meta{color:#8fa3bf;font-size:13px;margin-top:5px}
pre{white-space:pre-wrap;background:#080f1a;border:1px solid #25354d;border-radius:10px;padding:12px;overflow:auto}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#17243a;border:1px solid #304764;font-size:12px}
.hidden{display:none!important}
.err{color:#ff7c89}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div id="login" class="card">
<h1>H1 Bounty Agent</h1>
<p class="muted">Authorized research → evidence → human validation → HackerOne</p>
<input id="user" autocomplete="username" placeholder="Dashboard username">
<input id="pass" autocomplete="current-password" type="password" placeholder="Dashboard password (or DASHBOARD_SECRET)">
<button class="primary" onclick="connect()">Connect</button>
<p id="loginErr" class="err"></p>
</div>

<div id="app" class="hidden">
<div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-start">
<div><h1>H1 Bounty Agent</h1><p class="muted">Production review queue</p></div>
<div class="actions"><button id="run" onclick="runWorker()">Run research cycle</button><button onclick="load()">Refresh</button><button onclick="logout()">Logout</button></div>
</div>

<div class="grid">
<div class="card"><div class="metric" id="total">—</div><div class="muted">Findings</div></div>
<div class="card"><div class="metric" id="review">—</div><div class="muted">Awaiting review</div></div>
<div class="card"><div class="metric" id="submitMode">—</div><div class="muted">Submission mode</div></div>
</div>
<div class="card"><h2>Queue</h2><div id="list" class="muted">Loading…</div></div>
<div class="card">
<div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
<div><h2>HackerOne Programs</h2><p class="muted">Select a program after reviewing its current policy and scope.</p></div>
<button onclick="scanPrograms()">Scan Programs</button>
</div>
<div id="programs" class="muted">No scan yet.</div>
</div>
</div>
</main>

<script>
let token="";
let connected=false;

async function request(url, options){
  options=options||{};
  const headers=Object.assign({"Content-Type":"application/json"},options.headers||{});
  if(token) headers["X-Action-Token"]=token;
  const res=await fetch(url,Object.assign({credentials:"same-origin"},options,{headers}));
  const text=await res.text();
  let data; try{data=JSON.parse(text)}catch(e){data={detail:text}};
  if(!res.ok) throw new Error(data.detail||("HTTP "+res.status));
  return data;
}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
async function connect(){
  const username=document.getElementById("user").value.trim();
  const password=document.getElementById("pass").value;
  const err=document.getElementById("loginErr");
  err.textContent="";
  if(!username||!password){err.textContent="Enter both fields.";return;}
  try{
    const data=await request("/api/auth/login",{method:"POST",body:JSON.stringify({username,password})});
    token=data.action_token||"";
    connected=true;
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    await load();
  }catch(e){err.textContent=e.message;}
}
async function load(){
  try{
    const data=await request("/api/findings");
    token=data.action_token||token;
    const rows=data.findings||[];
    document.getElementById("total").textContent=rows.length;
    document.getElementById("review").textContent=rows.filter(x=>x.state==="needs_review"||x.state==="draft").length;
    document.getElementById("submitMode").textContent="Controlled";
    if(!rows.length){document.getElementById("list").innerHTML="<p class='muted'>No report candidates yet.</p>";return;}
    document.getElementById("list").innerHTML=rows.map(x=>{
      let b='<div class="finding card"><div style="display:flex;justify-content:space-between;gap:12px"><div><div class="title">'+esc(x.title||"Untitled")+'</div><div class="meta">'+esc(x.program_handle)+' · '+esc(x.target)+' · '+esc(x.severity||"review")+'</div></div><span class="badge">'+esc(x.state)+'</span></div>';
      b+='<div class="actions" style="margin-top:12px"><button onclick="view('+x.id+')">View report</button>';
      if(x.state==="needs_review"||x.state==="draft")b+='<button class="primary" onclick="approve('+x.id+')">✓ Approve</button>';
      if(x.state==="approved")b+='<button class="danger" onclick="submitFinding('+x.id+')">Submit to HackerOne</button>';
      b+='</div><details id="d'+x.id+'"><summary>Evidence / report</summary><pre id="p'+x.id+'">Open to load…</pre></details></div>'; return b;
    }).join("");
  }catch(e){
    if(e.message.toLowerCase().includes("connect")){logout();return;}
    document.getElementById("list").innerHTML="<p class='err'>"+esc(e.message)+"</p>";
  }
}
async function view(id){
  try{
    document.getElementById("p"+id).textContent=JSON.stringify(await request("/api/findings/"+id),null,2);
    document.getElementById("d"+id).open=true;
  }catch(e){alert(e.message)}
}
async function approve(id){
  if(!confirm("Confirm that you personally reproduced the issue, verified current scope/rules, checked evidence and duplicates, and approve this report?"))return;
  try{await request("/api/findings/"+id+"/approve",{method:"POST"});await load()}catch(e){alert(e.message)}
}
async function submitFinding(id){
  if(!confirm("Submit this already-approved report to HackerOne?"))return;
  try{const d=await request("/api/findings/"+id+"/submit",{method:"POST"});alert("Submitted. Report ID: "+(((d.report||{}).data||{}).id||"unknown"));await load()}catch(e){alert(e.message)}
}
async function scanPrograms(){
  const b=document.getElementById("run"); b.disabled=true; b.textContent="Scanning…";
  try{
    const d=await request("/api/worker",{method:"POST",body:JSON.stringify({})});
    renderPrograms(d.top_opportunities||[]);
  }catch(e){alert(e.message)}
  finally{b.disabled=false;b.textContent="Run research cycle"}
}

function renderPrograms(programs){
  const root=document.getElementById("programs");
  if(!programs.length){root.innerHTML="<p class=\"muted\">No programs returned.</p>";return;}
  root.innerHTML=programs.map(p=>{
    const handle=esc(p.handle);
    return `<div class="finding card">
      <div style="display:flex;justify-content:space-between;gap:12px">
        <div><div class="title">${esc(p.name)}</div>
        <div class="meta">${handle} · ${esc(p.state)} · ${p.bounty_assets} bounty assets · ${p.eligible_assets} eligible assets</div></div>
        <span class="badge">score ${p.triage_score}</span>
      </div>
      <div class="actions" style="margin-top:12px">
        <button class="primary" onclick="researchProgram(${JSON.stringify(p.handle)})">Research passively</button>
      </div>
    </div>`;
  }).join("");
}

async function researchProgram(handle){
  if(!confirm("Confirm you reviewed the current HackerOne program policy and authorize low-impact passive research for this program. Continue?")) return;
  try{
    const d=await request("/api/worker",{method:"POST",body:JSON.stringify({programs:[handle]})});
    renderResult(d);
    await load();
  }catch(e){alert(e.message)}
}

function renderResult(d){
  const lines=[];
  lines.push("Status: "+(d.status||"unknown"));
  lines.push("Mode: "+(d.mode||"unknown"));
  lines.push("Targets checked: "+(d.researched_targets||0));
  lines.push("Findings created: "+(d.created_findings||0));
  if(d.error) lines.push("Error: "+d.error);
  if(d.skipped&&d.skipped.length) lines.push("Notes:\n- "+d.skipped.join("\n- "));
  alert(lines.join("\n"));
}

async function runWorker(){
  await scanPrograms();
}
async function logout(){
  try{await fetch("/api/auth/logout",{method:"POST",credentials:"same-origin"})}catch(e){}
  token=""; connected=false;
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}
</script>
</body>
</html>
